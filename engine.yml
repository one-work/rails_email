name: 所有组件
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Engine Collect
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/engine
          ref: main
          submodules: true
          token: ${{ secrets.AK }}
      - name: Git Pull
        run: |
          git config user.email 'mingyuan.qin@qq.com'
          git config user.name 'Mingyuan Qin With Bot'
          git submodule foreach git checkout main
          git status
          git remote -v
          git add . -v
          git commit -m "${{ github.event.head_commit.timestamp }} - ${{ github.event.repository.name }}"
          git push
